name: scrape

on:
  schedule:
    # 00:00 UTC = 08:00 Beijing — kicks off at 8 AM, ~3-4 min scrape +
    # ~1-2 min deploy means Pages refreshes by ~08:10. Reader opens at
    # 9 AM and sees today's edition fully published. One snapshot/day.
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      refresh_only:
        description: Refresh data without email (recovery/re-run)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Workflow timeout — protects against stuck Playwright / hung Resend POST /
    # any pathology that would otherwise burn 6h of GH minutes silently.
    # Healthy run: 3-4 min. Outlier with Playwright fallback: ~6 min.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Recovery retains all attempts. A second run may refresh data but must
      # not automatically re-send an edition already attempted today.
      - name: Check scrape and delivery state independently
        id: dedupe
        env:
          REFRESH_ONLY: ${{ inputs.refresh_only }}
        run: |
          today_utc=$(date -u +%Y-%m-%d)
          if ls "data/history/${today_utc}T"*.json >/dev/null 2>&1; then
            echo "had_snapshot=true" >> "$GITHUB_OUTPUT"
            if [ "$REFRESH_ONLY" != "true" ] && jq -e '.data_quality.status == "healthy"' data/projects.json >/dev/null; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
            else
              echo "skip=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "had_snapshot=false" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.dedupe.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install deps
        if: steps.dedupe.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chromium for PDF render
        if: steps.dedupe.outputs.skip != 'true'
        # patchright ships its own Chromium binary download — we run BOTH
        # installers because scraper code prefers patchright for KS calls
        # (better CDP stealth) while pdf.py still uses vanilla playwright
        # for rendering. Both share Playwright's browser cache so installing
        # patchright Chromium is essentially free incremental work.
        run: |
          python -m playwright install --with-deps chromium
          python -m patchright install chromium || echo "patchright install skipped"
          python - <<'PYBROWSER' >> "$GITHUB_ENV"
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              print("KS_BROWSER_EXECUTABLE=" + p.chromium.executable_path)
          PYBROWSER

      # Restore CF session cookies from previous run — the biggest single
      # CF-pass-rate improvement (turns "fresh stranger from a flagged IP"
      # into "returning user with valid cf_clearance").
      - name: Restore session cookies cache
        if: steps.dedupe.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: .session_state.json
          key: ks-session-${{ github.run_id }}
          restore-keys: |
            ks-session-

      - name: Run scraper
        if: steps.dedupe.outputs.skip != 'true'
        env:
          # If the secret is unset, scraper.translate logs a warning and skips
          # auto-translation — pipeline still produces correct projects.json.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m scraper.run

      - name: Commit changes
        if: steps.dedupe.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "ks-tracker-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ reports/ assets/ site/editions/ site/social/ site/api/ site/feed.xml site/sitemap.xml site/robots.txt
          [ -f CHANGELOG.md ] && git add CHANGELOG.md || true
          if git diff --staged --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "snapshot $(date -u +%FT%TZ)"
          git push

      - name: Slack / Discord notify (optional)
        if: steps.dedupe.outputs.skip != 'true' && (env.SLACK_WEBHOOK != '' || env.DISCORD_WEBHOOK != '')
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python -m scraper.notify

      - name: Draft editor's notes (Beta · optional)
        # Generates 3 LLM-drafted candidate editor's notes from today's
        # snapshot. Email step picks them up and renders inside a
        # collapsible <details> "BETA" block at the bottom of the email
        # + archived edition. Hidden by default — reader clicks to view.
        # Skipped entirely if DEEPSEEK_API_KEY isn't set, so the rest of
        # the cron continues to work exactly as before.
        if: steps.dedupe.outputs.skip != 'true' && env.DEEPSEEK_API_KEY != ''
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          # `continue-on-error` style: even if the LLM API has a bad day,
          # we don't want the daily email blocked. Worst case: no Beta
          # section in today's email.
          python3 scripts/draft_editor_note.py \
            --json data/.editor_drafts.json \
            --temps 0.7,0.85,0.95 \
            --model deepseek-v4-pro \
            || echo "Editor drafts step failed; continuing without Beta block"
        continue-on-error: true

      - name: Email notify (optional)
        if: steps.dedupe.outputs.skip != 'true' && steps.dedupe.outputs.had_snapshot != 'true' && inputs.refresh_only != true && env.RESEND_API_KEY != '' && env.NOTIFY_EMAIL_TO != ''
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
          NOTIFY_EMAIL_FROM: ${{ secrets.NOTIFY_EMAIL_FROM }}
          # Subscribers list is now stored in Cloudflare KV (private),
          # not in this public repo. Worker /list endpoint is gated by
          # OWNER_TOKEN — must match the secret bound on the Worker side.
          OWNER_TOKEN: ${{ secrets.OWNER_TOKEN }}
          SUBSCRIBE_API_URL: ${{ secrets.SUBSCRIBE_API_URL }}
        run: python -m scraper.email_notify
