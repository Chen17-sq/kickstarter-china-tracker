name: test

# Runs the pytest suite + ruff lint on every push to main and every PR.
# Fast (<10s total when there's nothing to install from cache); no scraper
# secrets needed since tests are pure-logic and ruff is static analysis.
on:
  push:
    branches: [main]
    paths:
      - 'scraper/**'
      - 'subscribe-worker/**'
      - '.github/workflows/test.yml'
      - 'requirements*.txt'
      - 'pyproject.toml'
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          # Collector imports are exercised by isolated, network-disabled pipeline tests.
          pip install pytest pyyaml ruff curl_cffi httpx selectolax playwright

      - name: Lint (ruff)
        run: ruff check scraper/

      - name: Run pytest
        run: python -m pytest scraper/tests/ -v

  worker-tests:
    # Worker JS unit tests — Svix sig verify, sanitizeNick, rate-limit math.
    # Pure-logic, Node-only; no Wrangler/Miniflare required.
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Bundle check (esbuild)
        working-directory: subscribe-worker
        run: npx --yes esbuild worker.js --bundle --platform=neutral --target=es2022 --outfile=/tmp/_worker_check.js
      - name: Run worker tests
        working-directory: subscribe-worker
        run: node test_worker.mjs

  browser-lifecycle:
    # Local HTTP fixture only: prove real browser boot/query/cleanup on runner.
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright nodriver curl_cffi httpx selectolax pyyaml
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/refresh_probe.py --mode browser --output /tmp/browser-probe.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-probe
          path: /tmp/browser-probe.json

  source-readonly-probe:
    # No secrets or mutations. Green means diagnostics ran, not fresh production data.
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install httpx selectolax curl_cffi
      - run: python scripts/refresh_probe.py --mode source --output /tmp/source-probe.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-probe
          path: /tmp/source-probe.json

  currency-readonly-probe:
    # One public GraphQL query; no secrets, saved sessions, proxy discovery or data writes.
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright curl_cffi httpx selectolax pyyaml
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/currency_probe.py --output /tmp/currency-probe.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: currency-probe
          path: /tmp/currency-probe.json
